<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Client portfolio website preview</title>
  <desc id="desc">A dark and gold educator portfolio hero preview for Okafor Uche Joseph.</desc>
  <defs>
    <radialGradient id="glow" cx="32%" cy="55%" r="48%">
      <stop offset="0" stop-color="#d2ad59" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#455057" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#101820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
